# SeniorVideoFactory 설정 파일

# API Keys (환경변수로 관리하는 것을 권장)
api:
  gemini_api_key: ${GEMINI_API_KEY}
  openai_api_key: ${OPENAI_API_KEY}
  tts_api_key: ${TTS_API_KEY}

# 영상 설정
video:
  resolution: "1920x1080"
  fps: 30
  default_duration_minutes: 15
  duration_options: [10, 15, 20]

# 시니어 모드 설정
senior_mode:
  language: "ko-KR"
  voice_tone: "warm_slow"
  speech_speed: 0.92
  text_density: "low"
  cut_change_speed: "slow"
  max_points: 4

# 출력 설정
output:
  export_dir: "export"
  keep_temp_files: true
  video_codec: "libx264"
  audio_codec: "aac"

# 로깅 설정
logging:
  level: "INFO"
  log_file: "seniorvideo.log"
